<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Migraciones</title>
    <link rel="stylesheet" href="../Style/Main.css" />
</head>
<body class="clsBody">
    <div class="clsBodyDiv">
        <table class="clsBodyTable">
            <tr>
                <td class="clsTitle" colspan="2">
                    Migraciones
                </td>
            </tr>

            <tr>
                <td class="clsLabel" colspan="2">
                    Datos del Beneficiario
                    <br/>
                </td>
            </tr>

            <tr>
                <td class="clsText">
                    N° de DNI
                </td>
                <td>
                    <input type="text" class="clsTextBox" placeholder="Ingrese su N° de DNI"  onblur="javascript:window.location.href('us2_2.html');"/>
                    <a href="us2_2.html">
                    <img src="../Images/Search.png" onclick="javascript:window.location.href('us2_2.html');" alt="Buscar DNI" width="20" height="20">
                    </a>
                </td>
            </tr>

            <tr>
                <td class="clsText">
                    Nombres
                </td>
                <td>
                    <input type="text" class="clsTextBox" placeholder="Se completará automáticamente" />
                </td>
            </tr>

            <tr>
                <td class="clsText">
                    Apellidos
                </td>
                <td class="clsText">
                    <input type="text" class="clsTextBox" placeholder="Se completará automáticamente" />
                </td>
            </tr>

            <tr>
                <td class="clsText">
                    Fecha de Nacimiento
                </td>
                <td class="clsText">
                    <input type="date" class="clsTextBox" placeholder="Se completará automáticamente" />
                </td>
            </tr>

            <tr>
                <td class="clsText">
                    Correo Electrónico
                </td>
                <td class="clsText">
                    <input type="text" class="clsTextBox" placeholder="Ingrese su correo electrónico" />
                    <br/><br/>
                </td>
            </tr>

            <tr>
                <td class="clsLabel" colspan="2">
                    Datos del Pago
                    <br/>
                </td>
            </tr>

            <tr>
                <td class="clsText">
                    N° de recibo
                </td>
                <td class="clsText">
                    <input type="text" class="clsTextBox" placeholder="Ingrese el N° de recibo" />
                </td>
            </tr>

            <tr>
                <td class="clsText">
                    Fecha de pago
                </td>
                <td class="clsText">
                    <input type="date" class="clsTextBox" placeholder="dd/mm/yyyy" />
                </td>
            </tr>

            <tr>
                <td class="clsText">
                    Banco
                </td>
                <td class="clsText">
                    <select class="clsSelect" colspan="2">
                        <option value="1">Banco de la Nación</option>
                        <option value="2">Banco de Crédito del Perú</option>
                        <option value="3">Interbank</option>
                        <option value="4">Scotiabank</option>
                        <option value="5">BBVA</option>
                    </select>
                    <br/><br/>
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <button type="button" onclick="window.location.href='us2_1.html'"
                            class="clsButton">Continuar</button>
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center" class="clsText">
                    <br/><br/>
                    Ingrese el N° de DNI del beneficiario para consultar sus<br/>
                    datos en REBNIEC<br/>

                    <br/><br/>
                </td>
            </tr>

          </table>

    </div>
    <br/>


</body>
</html>
